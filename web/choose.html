<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose an account &mdash; idaas</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e9ef;--muted:#8b93a7;--acc:#4f8cff;--err:#ff6b6b;--line:#262b36}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
p.sub{color:var(--muted);font-size:13px;margin-bottom:24px;word-break:break-word}
.err{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:var(--err);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.err:empty{display:none}
form.acct{margin:0 0 8px}
button.row{display:flex;align-items:center;gap:12px;width:100%;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#0c0e13;color:var(--fg);font:inherit;font-size:15px;cursor:pointer;text-align:left}
button.row:hover{border-color:var(--acc)}
.ava{flex:0 0 32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.who{flex:1;overflow:hidden;text-overflow:ellipsis;word-break:break-all}
.go{color:var(--muted)}
.sep{border:0;border-top:1px solid var(--line);margin:20px 0}
a.other{display:block;text-align:center;color:var(--acc);font-size:14px;text-decoration:none;padding:10px;border-radius:8px}
a.other:hover{background:#0c0e13}
footer{margin-top:20px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Choose an account</h1>
  <p class="sub">{{SUB}}</p>
  <div class="err">{{ERROR}}</div>
  {{ACCOUNTS}}
  <hr class="sep">
  <a class="other" href="/login">Use another account</a>
  <footer>idaas &middot; Linux account login</footer>
</main>
</body>
</html>
