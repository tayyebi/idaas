# idaas client registry.
#
# Copy to ./data/clients.conf and edit; restart the container after changes.
# client_id is the [section] name. Redirect URIs are matched exactly.

# A confidential client (server-side app that can keep a secret):
[grafana]
secret = change-me-to-a-long-random-string
redirect_uri = https://grafana.example.com/login/generic_oauth
scope = openid profile email groups

# A public client (browser/CLI app; PKCE is mandatory for these):
[local-dev]
public
redirect_uri = http://localhost:3000/callback
scope = openid profile
